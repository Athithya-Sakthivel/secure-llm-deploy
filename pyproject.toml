[project]
name = "secure-llm-deploy"
version = "0.1.1"
description = "Secure single-GPU LLM serving with CPU prompt-injection defense and speculative decoding benchmarks"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Athithya" },
]
dependencies = [
    "fastapi==0.143.1",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "onnxruntime==1.31.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "tokenizers==0.23.3",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["image/src/secure_llm_deploy"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["image/src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "PT",
    "SIM",
    "ASYNC",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["secure_llm_deploy"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
pythonpath = ["image/src"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "unit: CPU-only unit tests",
    "api: API tests using mocked inference and process dependencies",
    "integration: tests that load real local model artifacts or a container",
]

[tool.coverage.run]
branch = true
source = ["secure_llm_deploy"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
files = [
    "image/src/secure_llm_deploy",
    "tests",
]
mypy_path = "$MYPY_CONFIG_FILE_DIR/image/src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
no_implicit_reexport = true
show_error_codes = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["onnxruntime"]
ignore_missing_imports = true
