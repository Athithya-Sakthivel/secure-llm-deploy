name: Production image supply chain

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/athithya-sakthivel/secure-llm-deploy

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      # Pin the action to its immutable commit; the tag is a human-readable annotation.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install a pinned uv version.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true

      # Install the latest available Python 3.14 patch release.
      - name: Install Python 3.14
        run: uv python install 3.14

      # Assumes uv.lock is committed to the repository.
      - name: Install dependencies
        run: uv sync --locked --python 3.14

      - name: Run tests
        run: uv run --locked --python 3.14 pytest

  build-scan-sign:
    name: Build, scan, sign, and attest
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate required secrets
        shell: bash
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER_NAME: ${{ secrets.GHCR_USER_NAME }}
        run: |
          set -euo pipefail

          if [[ -z "${GHCR_PAT:-}" ]]; then
            echo "::error::Repository secret GHCR_PAT is missing."
            exit 1
          fi

          if [[ -z "${GHCR_USER_NAME:-}" ]]; then
            echo "::error::Repository secret GHCR_USER_NAME is missing."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER_NAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build, generate SBOM, and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # Persistent cache shared across GitHub-hosted runners.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

          # Attach build provenance and an SBOM to the pushed image.
          provenance: mode=max
          sbom: true

      - name: Scan image and generate SARIF report
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          vuln-type: os,library
          scanners: vuln
          trivyignores: .trivyignore.yaml
          exit-code: "0"
          timeout: 15m0s
        env:
          TRIVY_USERNAME: ${{ secrets.GHCR_USER_NAME }}
          TRIVY_PASSWORD: ${{ secrets.GHCR_PAT }}

      - name: Enforce critical vulnerability gate
        shell: bash
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if [[ ! -s trivy-results.sarif ]]; then
            echo "Trivy SARIF report is missing; failing closed."
            echo "Report missing for ${IMAGE_REF}" > trivy-critical-gate.txt
            exit 1
          fi

          critical_count="$(jq '
            [
              .runs[]? as $run
              | $run.results[]? as $result
              | select(
                  (($run.tool.driver.rules[$result.ruleIndex].properties.tags // [])
                  | index("CRITICAL")) != null
                )
            ] | length
          ' trivy-results.sarif)"

          {
            echo "Image: ${IMAGE_REF}"
            echo "Critical vulnerability findings: ${critical_count}"
          } | tee trivy-critical-gate.txt

          if (( critical_count > 0 )); then
            echo "Release blocked: critical vulnerabilities were detected." \
              | tee -a trivy-critical-gate.txt
            exit 1
          fi

          echo "Critical vulnerability gate passed." \
            | tee -a trivy-critical-gate.txt

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-security-reports
          path: |
            trivy-results.sarif
            trivy-critical-gate.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload SARIF to GitHub code scanning
        if: ${{ always() && github.event.repository.private == false && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: trivy-results.sarif

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with keyless Sigstore signing
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_REF}"

      - name: Verify image signature
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp '(?i)^https://github\.com/Athithya-Sakthivel/secure-llm-deploy/\.github/workflows/release\.ya?ml@refs/(heads/main|tags/v.*)$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGE_REF}"

      - name: Attest image provenance to GitHub
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
