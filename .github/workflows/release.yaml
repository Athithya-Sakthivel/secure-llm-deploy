
name: Production image supply chain

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions: {}

concurrency:
  group: production-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-scan-sign-attest:
    name: Build, scan, sign, and attest
    if: github.repository == 'athithya-sakthivel/secure-llm-deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/athithya-sakthivel/secure-llm-deploy

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER_NAME: ${{ secrets.GHCR_USER_NAME }}
        run: |
          set -Eeuo pipefail
          [[ -n "$GHCR_PAT" ]] || {
            echo "GHCR_PAT is missing" >&2
            exit 1
          }
          [[ "$GHCR_USER_NAME" == "athithya-sakthivel" ]] || {
            echo "GHCR_USER_NAME is incorrect" >&2
            exit 1
          }

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USER_NAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./image
          file: ./image/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.title=secure-llm-deploy vLLM runtime
            org.opencontainers.image.source=https://github.com/athithya-sakthivel/secure-llm-deploy
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Generate SPDX SBOM for the pushed digest
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ secrets.GHCR_USER_NAME }}
          registry-password: ${{ secrets.GHCR_PAT }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # Report HIGH and CRITICAL findings without blocking the release.
      - name: Trivy vulnerability report
        id: trivy-report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scan-type: image
          version: v0.75.0
          format: sarif
          output: trivy-results.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
        env:
          TRIVY_USERNAME: ${{ secrets.GHCR_USER_NAME }}
          TRIVY_PASSWORD: ${{ secrets.GHCR_PAT }}

      # Block only on CRITICAL findings, including those without a fix.
      - name: Trivy CRITICAL vulnerability gate
        id: trivy-critical
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scan-type: image
          version: v0.75.0
          format: table
          output: trivy-critical-gate.txt
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ secrets.GHCR_USER_NAME }}
          TRIVY_PASSWORD: ${{ secrets.GHCR_PAT }}

      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnerability-reports-${{ github.run_id }}
          path: |
            trivy-results.sarif
            trivy-critical-gate.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload SARIF to GitHub Code Scanning
        if: ${{ always() && github.event.repository.private == false && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Preserve SPDX SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-spdx-${{ github.run_id }}
          path: sbom.spdx.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign pushed image digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Verify image signature
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/athithya-sakthivel/secure-llm-deploy/\.github/workflows/release\.yml@refs/(heads/main|tags/v.*)$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Attest build provenance
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          github-token: ${{ github.token }}

      - name: Attest SPDX SBOM
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          github-token: ${{ github.token }}

      - name: Publish deployment digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          {
            echo "## Production image"
            echo
            echo "Image: \`${IMAGE_NAME}@${IMAGE_DIGEST}\`"
            echo
            echo "Deploy using this immutable digest."
          } >> "$GITHUB_STEP_SUMMARY"
